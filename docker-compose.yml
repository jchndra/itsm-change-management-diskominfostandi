services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paraf_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - paraf_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: paraf_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - paraf_network
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: paraf_mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: paraf
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
      MYSQL_USER: paraf_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-local_paraf_password}
    volumes:
      - paraf_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - paraf_network
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: paraf_phpmyadmin
    profiles:
      - tools
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - paraf_network
    restart: unless-stopped

volumes:
  paraf_mysql_data:

networks:
  paraf_network:
    driver: bridge
